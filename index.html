<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>May I Be Yours?</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: #121212;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Inter', sans-serif;
  overflow: hidden;
  position: relative;
}

/* ✨ Grain effect */
body::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background: url("https://grainy-gradients.vercel.app/noise.svg");
  opacity: 0.05;
  animation: grain 8s infinite;
}

@keyframes grain {
  0%,100% { transform: translate(0,0); }
  25% { transform: translate(-5%,5%); }
  50% { transform: translate(5%,-5%); }
  75% { transform: translate(-5%,-5%); }
}

.container {
  width: 90%;
  max-width: 420px;
  padding: 50px 25px;
  text-align: center;
  border-radius: 18px;
  background: #1c1c1c;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  z-index: 1;
}

h1 {
  font-family: 'Playfair Display', serif;
  color: white;
  font-size: clamp(1.8rem, 5vw, 2.3rem);
  margin-bottom: 40px;
  line-height: 1.3;
  word-wrap: break-word;
}

.buttons {
  position: relative;
  width: 100%;
  height: 160px;
}

button {
  padding: 14px 28px;
  font-size: 1rem;
  border-radius: 30px;
  border: none;
  position: absolute;
}

#yesBtn {
  left: 20%;
  background: white;
  color: black;
  cursor: pointer;
  transition: transform 0.2s ease;
}

#noBtn {
  left: 55%;
  top: 50px;
  background: transparent;
  color: #aaa;
  border: 1px solid #444;
  pointer-events: none;
  transition: left 0.12s linear, top 0.12s linear;
}

#success {
  display: none;
  text-align: center;
  color: white;
  font-size: clamp(1.8rem, 5vw, 2.5rem);
  font-family: 'Playfair Display', serif;
  animation: fadeIn 0.8s ease forwards;
  padding: 20px;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 💖 Heart particles */
.heart {
  position: fixed;
  color: red;
  font-size: 20px;
  animation: float 1s ease-out forwards;
}

@keyframes float {
  to {
    transform: translateY(-100px) scale(1.5);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container" id="main">
  <h1>May I be yours?</h1>

  <div class="buttons" id="area">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>
</div>

<div id="success">
  SHE SAID YES, SHEEEEEEE SAIDDDDDDDD YESSSSSSSJSFKSDNK SHE SAID YES OML OML OML OML YEAYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYAYAYAYAYAYAYAYAYAYYAY HAPPIEST MOMENT OF MY ENTIRE LIFE KDNJDBVDUBVKDNCNKDCBKSCNKSCKNFKSNFKSDNSKDNSKNS I WILL CRY
</div>

<script>
const noBtn = document.getElementById("noBtn");
const area = document.getElementById("area");
const yesBtn = document.getElementById("yesBtn");
const main = document.getElementById("main");
const success = document.getElementById("success");

/* 🧠 Escape logic */
function moveAway(x, y) {
  const rect = noBtn.getBoundingClientRect();

  const btnX = rect.left + rect.width / 2;
  const btnY = rect.top + rect.height / 2;

  const dx = x - btnX;
  const dy = y - btnY;

  const distance = Math.sqrt(dx*dx + dy*dy);

  if (distance < 170) {
    const angle = Math.atan2(dy, dx);
    const move = 130;

    let newLeft = noBtn.offsetLeft - Math.cos(angle) * move;
    let newTop = noBtn.offsetTop - Math.sin(angle) * move;

    newLeft = Math.max(0, Math.min(area.clientWidth - noBtn.offsetWidth, newLeft));
    newTop = Math.max(0, Math.min(area.clientHeight - noBtn.offsetHeight, newTop));

    noBtn.style.left = newLeft + "px";
    noBtn.style.top = newTop + "px";
  }
}

document.addEventListener("mousemove", e => moveAway(e.clientX, e.clientY));
document.addEventListener("touchstart", e => moveAway(e.touches[0].clientX, e.touches[0].clientY));
document.addEventListener("touchmove", e => moveAway(e.touches[0].clientX, e.touches[0].clientY));

/* 💖 Yes grows slowly */
let scale = 1;
setInterval(() => {
  scale += 0.02;
  yesBtn.style.transform = `scale(${scale})`;
}, 800);

/* 💥 Heart burst */
function createHearts(x, y) {
  for (let i = 0; i < 12; i++) {
    const heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.className = "heart";

    heart.style.left = x + "px";
    heart.style.top = y + "px";

    const angle = Math.random() * 2 * Math.PI;
    const distance = 60 + Math.random() * 40;

    heart.style.transform = `translate(${Math.cos(angle)*distance}px, ${Math.sin(angle)*distance}px)`;

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 1000);
  }
}

yesBtn.addEventListener("click", (e) => {
  createHearts(e.clientX || window.innerWidth/2, e.clientY || window.innerHeight/2);

  main.style.display = "none";
  success.style.display = "block";
});
</script>

</body>
</html>

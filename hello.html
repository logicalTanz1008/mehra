<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>May I Be Yours?</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 55px 35px;
      text-align: center;
      border-radius: 18px;
      background: #1c1c1c;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: white;
      font-size: 2.2rem;
      margin-bottom: 45px;
    }

    .buttons {
      position: relative;
      width: 100%;
      height: 160px;
    }

    button {
      padding: 14px 28px;
      font-size: 1rem;
      border-radius: 30px;
      border: none;
      position: absolute;
    }

    #yesBtn {
      left: 20%;
      background: white;
      color: black;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #yesBtn:hover {
      transform: scale(1.08);
    }

    #noBtn {
      left: 55%;
      top: 50px;
      background: transparent;
      color: #aaa;
      border: 1px solid #444;
      pointer-events: none; /* makes it unclickable */
      transition: left 0.12s linear, top 0.12s linear;
    }

    #success {
      display: none;
      text-align: center;
      color: white;
      font-size: 2.3rem;
      font-family: 'Playfair Display', serif;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container" id="main">
  <h1>May I be yours?</h1>

  <div class="buttons" id="area">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>
</div>

<div id="success">
  SHE SAID YES, SHEEEEEEE SAIDDDDDDDD YESSSSSSSJSFKSDNK SHE SAID YES OML OML OML OML YEAYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYAYAYAYAYAYAYAYAYAYYAY HAPPIEST MOMENT OF MY ENTIRE LIFE KDNJDBVDUBVKDNCNKDCBKSCNKSCKNFKSNFKSDNSKDNSKNS I WILL CRY
</div>

<script>
  const noBtn = document.getElementById("noBtn");
  const area = document.getElementById("area");
  const yesBtn = document.getElementById("yesBtn");
  const main = document.getElementById("main");
  const success = document.getElementById("success");

  function moveAway(x, y) {
    const rect = noBtn.getBoundingClientRect();

    const btnX = rect.left + rect.width / 2;
    const btnY = rect.top + rect.height / 2;

    const dx = x - btnX;
    const dy = y - btnY;

    const distance = Math.sqrt(dx * dx + dy * dy);

    // Large radius so it escapes BEFORE you reach it
    if (distance < 170) {
      const angle = Math.atan2(dy, dx);
      const move = 130;

      let newLeft = noBtn.offsetLeft - Math.cos(angle) * move;
      let newTop = noBtn.offsetTop - Math.sin(angle) * move;

      // Keep inside area
      newLeft = Math.max(0, Math.min(area.clientWidth - noBtn.offsetWidth, newLeft));
      newTop = Math.max(0, Math.min(area.clientHeight - noBtn.offsetHeight, newTop));

      noBtn.style.left = newLeft + "px";
      noBtn.style.top = newTop + "px";
    }
  }

  // Desktop (mouse)
  document.addEventListener("mousemove", (e) => {
    moveAway(e.clientX, e.clientY);
  });

  // Mobile (touch)
  document.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    moveAway(t.clientX, t.clientY);
  });

  document.addEventListener("touchmove", (e) => {
    const t = e.touches[0];
    moveAway(t.clientX, t.clientY);
  });

  // Yes button
  yesBtn.addEventListener("click", () => {
    main.style.display = "none";
    success.style.display = "block";
  });
</script>

</body>
</html>
